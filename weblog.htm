<HR>
<FORM METHOD="POST" ACTION="../cgi-bin/weblog.pl">

<H2>
Month to search on: <br>
</H2>

<SELECT NAME="Month">

  <OPTION> Feb
  <OPTION> Mar
  <OPTION> Apr
  <OPTION> May
  <OPTION> Jun
  <OPTION> Jul
  <OPTION> Aug
  <OPTION> Sep
  <OPTION> Oct
  <OPTION> Nov
  <OPTION> Dec
</SELECT>

<br>

<P>
Keyword: <INPUT SIZE=40 NAME="Keyword"><BR>
<P>

<INPUT TYPE="submit" VALUE="Submit">
<INPUT TYPE="reset" VALUE="Clear">
</FORM>
